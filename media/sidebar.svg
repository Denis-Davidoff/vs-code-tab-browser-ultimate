<!-- The activity bar icon: the app icon in one colour — the globe up and to the left, the two
     letters across the lower right, as in `media/icon.svg`.

     VS Code paints this through a mask, so only the alpha matters and the letters cannot simply
     sit on top of the globe: they would merge with the lines behind them. The mask knocks a gap
     for them out of the globe, which is the job the dark outline does in the full colour icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
	<mask id="letter-gap">
		<rect width="24" height="24" fill="#ffffff"/>
		<g fill="none" stroke="#000000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
			<path d="M10.7 21.3 13.8 13.3 16.9 21.3"/>
			<path d="M12 18.7h3.6"/>
			<path d="M20.1 13.3v8"/>
		</g>
	</mask>

	<g mask="url(#letter-gap)" fill="none" stroke="#ffffff">
		<circle cx="9.2" cy="9.2" r="6.6" stroke-width="1.4"/>
		<!-- One meridian and the equator: at 24px a second parallel is only fuzz. -->
		<ellipse cx="9.2" cy="9.2" rx="2.8" ry="6.6" stroke-width="1.15"/>
		<path d="M2.6 9.2h13.2" stroke-width="1.15"/>
	</g>

	<g fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
		<path d="M10.7 21.3 13.8 13.3 16.9 21.3"/>
		<path d="M12 18.7h3.6"/>
		<path d="M20.1 13.3v8"/>
	</g>
</svg>
