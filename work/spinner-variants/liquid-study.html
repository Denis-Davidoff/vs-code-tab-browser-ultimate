<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Browser — 6 жидких спиннеров</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9e7f2;background:#111116}*{box-sizing:border-box}body{margin:0;padding:28px 32px 24px;max-width:1500px;margin-inline:auto}.top{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#9990b8;font-weight:600}h1{font-size:26px;letter-spacing:-.8px;margin:8px 0 5px;font-weight:550}.intro{color:#9b98aa;font-size:12px;margin:0}.badge{font-size:10px;color:#a5d9d7;background:#19292b;border:1px solid #2c4548;padding:7px 10px;border-radius:20px;white-space:nowrap}.controls{display:flex;align-items:center;gap:8px;margin:22px 0 18px;flex-wrap:wrap}button,select{font:inherit;font-size:11px;color:#cbc6de;background:#22212c;border:1px solid #363241;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{border-color:#a99aeb}#play{min-width:90px;background:#322a49;color:#ddd1ff}input{accent-color:#b09af0;flex:1;min-width:100px;max-width:340px}#clock{color:#8d889f;font:10px monospace;min-width:88px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{border:1px solid #2b2838;border-radius:14px;background:#19181f;padding:17px 20px 10px;overflow:hidden}.stage{display:flex;align-items:center;justify-content:center;height:155px;background:radial-gradient(ellipse at center,#28223955,transparent 68%)}h2{font-size:16px;font-weight:550;letter-spacing:-.3px;margin:7px 0}p{color:#9994a8;font-size:11px;line-height:1.5;min-height:34px;margin:0 0 10px;max-width:300px}.sizes{display:flex;align-items:end;justify-content:space-around;border-top:1px solid #2b2835;padding-top:9px;height:78px}.sizes>div{display:flex;align-items:center;justify-content:end;flex-direction:column;gap:4px}.sizes small{font:9px monospace;color:#797386}svg{display:block;overflow:visible}footer{font-size:10px;color:#767080;margin-top:15px;line-height:1.6}@media(max-width:750px){body{padding:20px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}article{padding:13px}.stage{height:140px}.badge{display:none}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div><div class="eyebrow">AI BROWSER / MOTION STUDY</div><h1>Жидкость внутри контура</h1><div class="intro">Шесть характеров движения · точка → растекание → шестиугольник → круг</div></div><div class="badge">Живые SVG · 16–148 px</div></div>
<div class="controls"><button id="play">Пауза</button><select id="speed" aria-label="Скорость"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><input id="time" aria-label="Фаза анимации" type="range" min="0" max="100" step=".01"><span id="clock"></span><button data-phase="0">Круг</button><button data-phase=".18">Перелив</button><button data-phase=".42">Шестиугольник</button><button data-phase=".7">Точка</button></div>
<main id="grid" class="grid"></main>
<footer>Цикл 40 секунд · быстрый переход через шестиугольник · точка 4 px. Центр перераспределяется вдоль стенок с сохранением площади в фазе перелива.</footer>
<script type="module" src="./liquid-study.mjs"></script></body></html>
