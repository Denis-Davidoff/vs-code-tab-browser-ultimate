name: exchange-server

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3001
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  DATABASE_SCHEMA: exchange
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: https://aibrowser.tools
  WEB_ORIGIN: https://aibrowser.tools

services:
  migrate:
    image: exchange-server-api:local
    build:
      context: /opt/exchange-server
      dockerfile: exchange-server/deploy/Dockerfile
      target: api
    command: ["node", "scripts/migrate.mjs"]
    environment:
      <<: *api-environment
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL}
    volumes:
      - /run/postgresql:/run/postgresql:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: "no"

  api:
    image: exchange-server-api:local
    build:
      context: /opt/exchange-server
      dockerfile: exchange-server/deploy/Dockerfile
      target: api
    environment: *api-environment
    ports: ["127.0.0.1:3101:3001"]
    volumes:
      - /run/postgresql:/run/postgresql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: exchange-server-web:local
    build:
      context: /opt/exchange-server
      dockerfile: exchange-server/deploy/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://api:3001
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    restart: unless-stopped
