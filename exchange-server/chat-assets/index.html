<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Browser Chat</title><link rel="stylesheet" href="codicon.css"><link rel="stylesheet" href="chat.css"><link rel="stylesheet" href="sidepanel.css"><link rel="stylesheet" href="web-chat.css"></head>
<body><header class="remote-shell"><span id="status" role="status">Connecting…</span><select id="conversation" aria-label="Conversation" title="Switch conversation"></select><button id="new-chat" title="New chat" aria-label="New chat"><span class="codicon codicon-add"></span></button><button id="history" title="Chat history" aria-label="Chat history"><span class="codicon codicon-history"></span></button><button id="awake" title="Keep awake" aria-label="Keep awake"><span class="codicon codicon-coffee"></span></button><button id="settings" title="Chat settings" aria-label="Chat settings"><span class="codicon codicon-settings-gear"></span></button></header><div id="waiting">Connect your VS Code workspace to load the chat.</div><div id="app" hidden></div><script src="host.js"></script><script src="chat.js"></script></body></html>
