<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Browser</title>
  <link rel="stylesheet" href="codicon.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="chrome-shell">
    <span>AI Browser</span>
    <span class="liquid-loader connection-spinner" aria-hidden="true"></span>
    <span id="status" role="status" aria-live="polite" data-busy="true">Initializing…</span>
    <select id="conversation" title="Conversation shown in Chrome. Switching editor tabs does not change it." hidden></select>
    <button id="mode" type="button" aria-expanded="false" hidden></button>
    <span id="remote-actions"></span>
    <button id="disconnect" type="button" hidden>Disconnect</button>
  </header>
  <div id="mode-details" class="chrome-shell" role="note" hidden>
    <p id="mode-text"></p>
    <button id="mode-close" type="button" title="Close" aria-label="Close">✕</button>
  </div>
  <div id="element-picker-controls" class="chrome-shell" hidden>
    <span id="element-picker-status"></span>
    <button id="cancel-element-pick" type="button">Cancel</button>
  </div>
  <form id="pairing" class="chrome-shell">
    <h2>Connect to the editor chat</h2>
    <p>Your editor will be found automatically. Click Allow in the conversation you want to connect.</p>
    <button id="quick-connect" type="button">Connect</button>
    <button id="cancel-connect" type="button" hidden>Cancel</button>
    <div id="editor-sources"></div>
    <details id="manual-pairing">
    <summary>Connect manually</summary>
    <p>In VS Code, run <strong>AI Browser: Connect Chrome Chat (Preview)</strong> and enter this extension ID:</p>
    <code id="extension-id"></code>
    <label for="connection">Paste the connection code copied by the editor</label>
    <textarea id="connection" rows="4" spellcheck="false" autocomplete="off" required></textarea>
    <button type="submit">Connect to VS Code</button>
    </details>
  </form>
  <div id="app" hidden></div>
  <script src="sidepanel.js"></script>
  <script src="chat.js"></script>
</body>
</html>
